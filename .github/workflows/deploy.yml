name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DIESW_ASSETS_DIR: ${{ github.workspace }}/.cache/diesw-assets
      DIESW_ASSETS_REF: ${{ vars.DIESW_ASSETS_REF || 'main' }}
      VITE_GISCUS_REPO: ${{ vars.VITE_GISCUS_REPO }}
      VITE_GISCUS_REPO_ID: ${{ vars.VITE_GISCUS_REPO_ID }}
      VITE_GISCUS_CATEGORY: ${{ vars.VITE_GISCUS_CATEGORY }}
      VITE_GISCUS_CATEGORY_ID: ${{ vars.VITE_GISCUS_CATEGORY_ID }}
      VITE_GISCUS_MAPPING: ${{ vars.VITE_GISCUS_MAPPING }}
      VITE_GISCUS_STRICT: ${{ vars.VITE_GISCUS_STRICT }}
      VITE_GISCUS_REACTIONS_ENABLED: ${{ vars.VITE_GISCUS_REACTIONS_ENABLED }}
      VITE_GISCUS_INPUT_POSITION: ${{ vars.VITE_GISCUS_INPUT_POSITION }}
      VITE_GISCUS_THEME: ${{ vars.VITE_GISCUS_THEME }}
      VITE_GISCUS_LANG: ${{ vars.VITE_GISCUS_LANG }}
      VITE_CODE_RUNNER_API_URL: ${{ vars.VITE_CODE_RUNNER_API_URL }}
      VITE_CODE_RUNNER_API_TOKEN: ${{ vars.VITE_CODE_RUNNER_API_TOKEN }}
      VITE_INFRA_PROBE_URL: ${{ vars.VITE_INFRA_PROBE_URL || secrets.API_PROXY_BASE }}

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `pnpm run build` regenerates src/data/docs/generated.ts, and the
          # generator dates each doc from the last commit that touched its file.
          # The default shallow checkout holds a single commit, so every file
          # would report the same date — the repository's tip — and the whole
          # site would claim it was updated the moment the workflow ran.
          fetch-depth: 0

      - name: Checkout assets repository
        env:
          DIESW_ASSETS_TOKEN: ${{ secrets.DIESW_ASSETS_TOKEN }}
        run: node scripts/checkout-assets-repo.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Infra status probing
        run: pnpm test:infra-status

      - name: Verify Pages deployment handoff
        run: pnpm test:pages-deploy

      - name: Verify image annotation storage
        run: pnpm test:image-annotations

      - name: Verify large screenshot galleries
        run: pnpm test:capture-gallery

      # 调试时可开启，确认变量是否注入成功
      # - name: Debug env
      #   run: |
      #     echo "REPO=$VITE_GISCUS_REPO"
      #     echo "THEME=$VITE_GISCUS_THEME"

      - name: Build
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: node scripts/deploy-pages.mjs

name: Sync Vorlage Template

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-vorlage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-vorlage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check starter token
        env:
          STARTER_PUSH_TOKEN: ${{ secrets.STARTER_PUSH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STARTER_PUSH_TOKEN}" ]; then
            echo "STARTER_PUSH_TOKEN is not set." >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install source dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Initialize staging paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "EXPORT_DIR=${RUNNER_TEMP}/vorlage-export"
            echo "TARGET_DIR=${RUNNER_TEMP}/vorlage-repository"
          } >> "$GITHUB_ENV"

      - name: Prepare Vorlage export
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-template.mjs \
            --source-root "${GITHUB_WORKSPACE}" \
            --source-sha "${GITHUB_SHA}" \
            --output "${EXPORT_DIR}"

      - name: Validate exported source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-template.mjs --root "${EXPORT_DIR}"

      - name: Install exported dependencies
        shell: bash
        run: pnpm --dir "$EXPORT_DIR" install --frozen-lockfile

      - name: Run exported Infra status regression
        shell: bash
        run: pnpm --dir "$EXPORT_DIR" test:infra-status

      - name: Typecheck exported repository
        shell: bash
        run: pnpm --dir "$EXPORT_DIR" typecheck

      - name: Build Vorlage Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          export BASE_PATH="/Vorlage/"
          pnpm --dir "$EXPORT_DIR" build

      - name: Validate built Vorlage artifact
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-template.mjs \
            --root "${EXPORT_DIR}" \
            --dist "$EXPORT_DIR/dist"

      - name: Check source freshness
        shell: bash
        run: |
          set -euo pipefail
          latest_source_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "${latest_source_sha}" != "${GITHUB_SHA}" ]; then
            echo "Source main advanced from ${GITHUB_SHA} to ${latest_source_sha}; refusing stale template sync." >&2
            exit 1
          fi

      - name: Clone Vorlage target
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch main --single-branch \
            https://github.com/dieWehmut/Vorlage.git \
            "${TARGET_DIR}"
          target_sha="$(git -C "${TARGET_DIR}" rev-parse refs/remotes/origin/main)"
          echo "Vorlage target SHA: ${target_sha}"
          printf '%s\n' "${target_sha}" > "${RUNNER_TEMP}/vorlage-target-sha"

      - name: Mirror validated export and push
        env:
          STARTER_PUSH_TOKEN: ${{ secrets.STARTER_PUSH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(cat "${RUNNER_TEMP}/vorlage-target-sha")"
          rm -rf \
            "${TARGET_DIR}/node_modules" \
            "${TARGET_DIR}/dist" \
            "${TARGET_DIR}/public/capture-assets" \
            "${TARGET_DIR}/public/infra-status.json"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='public/capture-assets/' \
            --exclude='public/infra-status.json' \
            "${EXPORT_DIR}/" "${TARGET_DIR}/"

          latest_source_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "${latest_source_sha}" != "${GITHUB_SHA}" ]; then
            echo "Source main advanced from ${GITHUB_SHA} to ${latest_source_sha}; refusing stale template sync." >&2
            exit 1
          fi

          git -C "${TARGET_DIR}" config user.email "diesehnsucht0@gmail.com"
          git -C "${TARGET_DIR}" config user.name "dieWehmut"
          git -C "${TARGET_DIR}" add -A

          latest_target_sha="$(git ls-remote https://github.com/dieWehmut/Vorlage.git refs/heads/main | cut -f1)"
          if [ "${latest_target_sha}" != "${target_sha}" ]; then
            echo "Vorlage main advanced from ${target_sha} to ${latest_target_sha}; refusing stale template sync." >&2
            exit 1
          fi

          if git -C "${TARGET_DIR}" diff --cached --quiet; then
            echo "Vorlage already matches source ${GITHUB_SHA}."
          else
            git -C "${TARGET_DIR}" commit -m "sync: mirror source ${GITHUB_SHA}"
            latest_source_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
            if [ "${latest_source_sha}" != "${GITHUB_SHA}" ]; then
              echo "Source main advanced from ${GITHUB_SHA} to ${latest_source_sha}; refusing stale template sync." >&2
              exit 1
            fi
            authorization_header="$(printf 'x-access-token:%s' "${STARTER_PUSH_TOKEN}" | base64 -w0)"
            git -C "${TARGET_DIR}" \
              -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${authorization_header}" \
              push \
              --force-with-lease=refs/heads/main:${target_sha} \
              origin HEAD:main
          fi

      - name: Update Vorlage repository metadata
        env:
          STARTER_PUSH_TOKEN: ${{ secrets.STARTER_PUSH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${STARTER_PUSH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dieWehmut/Vorlage \
            -d '{
              "description": "A blog template with an integrated code sandbox and binary infrastructure reachability dashboard.",
              "homepage": "https://diewehmut.github.io/Vorlage/",
              "is_template": true
            }' > /dev/null

          metadata="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${STARTER_PUSH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dieWehmut/Vorlage)"

          METADATA_JSON="${metadata}" node --input-type=module <<'NODE'
          const metadata = JSON.parse(process.env.METADATA_JSON)
          if (
            metadata.name !== 'Vorlage' ||
            metadata.default_branch !== 'main' ||
            metadata.description !== 'A blog template with an integrated code sandbox and binary infrastructure reachability dashboard.' ||
            metadata.homepage !== 'https://diewehmut.github.io/Vorlage/' ||
            metadata.is_template !== true
          ) {
            console.error(
              'Repository metadata did not converge.',
              metadata.name,
              metadata.default_branch,
              metadata.description,
              metadata.homepage,
              metadata.is_template,
            )
            process.exit(1)
          }
          console.log('Repository metadata verified.')
          NODE
